<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Vikas Laddha - Stock Market Channel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Background changing smoothly between Red, Blue, Yellow, and White/Light tones */
            background: linear-gradient(-45deg, #ff3333, #3366ff, #ffcc00, #f8fafc, #ff3333);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            /* Dark background for the card so text is clearly readable on colorful background */
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 35px 24px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            border: 1.5px solid #ffcc00;
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            background: rgba(255, 204, 0, 0.1);
        }

        .title {
            color: #ffcc00;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.6), 0 0 25px rgba(255, 204, 0, 0.2);
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .divider {
            border: none;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
            margin: 0 10px 24px 10px;
        }

        .features-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
            text-align: left;
            padding: 0 5px;
        }

        .feature-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-icon {
            font-size: 1.1rem;
            margin-right: 12px;
            min-width: 24px;
            text-align: center;
        }

        .feature-text {
            color: #f1f5f9;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Border Bubbling / Pulsing Animation Effect */
        @keyframes borderBubble {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.8);
            }
            70% {
                box-shadow: 0 0 0 14px rgba(255, 204, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
            }
        }

        .join-btn {
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            color: #111111;
            border: none;
            border-radius: 12px;
            width: 100%;
            padding: 15px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 20px;
            animation: borderBubble 2s infinite ease-in-out;
            transition: transform 0.1s ease;
        }

        .join-btn:hover {
            animation: borderBubble 1s infinite ease-in-out;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            color: #cbd5e1;
            font-size: 0.75rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .verified-badge {
            color: #38bdf8;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">India's Best Stock Market Channel</div>

        <h1 class="title">Dr. Vikas Laddha</h1>

        <p class="subtitle">Daily Accurate Calls | High Profit Potential</p>

        <hr class="divider">

        <div class="features-container">
            <div class="feature-row">
                <span class="feature-icon">📊</span>
                <span class="feature-text">Daily Nifty & BankNifty Levels</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">🎓</span>
                <span class="feature-text">No Paid Tips – Purely Educational</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">⏳</span>
                <span class="feature-text">5+ Years of Market Experience</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">👥</span>
                <span class="feature-text">60,000+ Subscribers Trust Us</span>
            </div>
        </div>

        <button class="join-btn">
            JOIN OFFICIAL TELEGRAM CHANNEL
        </button>

        <p class="footer-text">
            <span class="verified-badge">✔ Verified Channel</span> • Free Forever • No Spam
        </p>
    </div>

</body>
</html>
