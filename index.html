<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyan Matka UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen font-sans">

    <!-- Mobile Screen Container -->
    <div class="w-[390px] bg-[#0b0f19] rounded-[36px] border-2 border-amber-400 p-6 shadow-[0_0_30px_rgba(251,191,36,0.15)] text-white flex flex-col items-center relative overflow-hidden">
        
        <!-- Header Section: Extra Bold Kalyan Matka -->
        <h1 class="text-3xl font-black tracking-widest text-amber-400 text-center drop-shadow-[0_0_15px_rgba(251,191,36,0.6)] mt-2 uppercase">KALYAN MATKA</h1>
        <p class="text-[10px] tracking-[0.1em] text-cyan-200 font-bold mt-1 mb-6 uppercase text-center">SRIDEVI • TIME BAZAAR • KALYAN DAY</p>

        <!-- Top Section: Thumbnail & Dual Action Buttons -->
        <div class="flex w-full gap-3 mb-5">
            <!-- Thumbnail Image -->
            <div class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-amber-400/80 shrink-0 shadow-md">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=300&q=80" alt="Scenery Thumbnail" class="w-full h-full object-cover">
            </div>
            <!-- Stacked Buttons -->
            <div class="flex flex-col justify-between flex-1 gap-2">
                <button class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 px-2 rounded-xl shadow-md flex items-center justify-center gap-1 border border-blue-400/30 transition-all cursor-pointer">
                    <span>🏆</span> OPEN • JODI • PANEL
                </button>
                <button class="w-full bg-amber-400 hover:bg-amber-300 text-gray-950 text-xs font-black py-3 px-2 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all cursor-pointer uppercase">
                    BAAZIGAR MATKA
                </button>
            </div>
        </div>

        <!-- Main CTA Button: JOIN TELEGRAM CHANNEL with logos on both sides -->
        <button class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_4px_20px_rgba(37,99,235,0.4)] flex items-center justify-between mb-5 text-sm tracking-wide border border-blue-400/40 transition-all cursor-pointer">
            <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-sm shrink-0">
                <i class="fa-brands fa-telegram text-base"></i>
            </span>
            <span class="flex-1 text-center font-extrabold tracking-wider">JOIN TELEGRAM CHANNEL</span>
            <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-sm shrink-0">
                <i class="fa-brands fa-telegram text-base"></i>
            </span>
        </button>

        <!-- Feature List Items -->
        <div class="w-full space-y-3 mb-5">
            <div class="w-full bg-[#121826] border border-gray-800/80 rounded-2xl py-3.5 px-4 flex items-center gap-3 text-xs font-bold tracking-wider text-gray-200 shadow-inner">
                <span class="text-cyan-400 text-sm">✓</span> MARKET ANALYSIS AND FREE TIPS
            </div>
            <div class="w-full bg-[#121826] border border-gray-800/80 rounded-2xl py-3.5 px-4 flex items-center gap-3 text-xs font-bold tracking-wider text-gray-200 shadow-inner">
                <span class="text-cyan-400 text-sm">⚡</span> SATKA MATKA ALL GAME AVAILABLE
            </div>
        </div>

        <!-- Second Button (Replaced VIP Zone with upper-style button + logos on both sides) -->
        <button class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_4px_20px_rgba(37,99,235,0.4)] flex items-center justify-between mb-5 text-sm tracking-wide border border-blue-400/40 transition-all cursor-pointer">
            <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-sm shrink-0">
                <i class="fa-brands fa-telegram text-base"></i>
            </span>
            <span class="flex-1 text-center font-extrabold tracking-wider">JOIN VIP CHANNEL NOW</span>
            <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-sm shrink-0">
                <i class="fa-brands fa-telegram text-base"></i>
            </span>
        </button>

        <!-- Divider -->
        <div class="w-full h-[1px] bg-gray-800 mb-4"></div>

        <!-- Footer Text (Research line removed, keeping only requested text) -->
        <div class="text-[12px] text-amber-400 font-extrabold text-center tracking-wide uppercase px-2 drop-shadow-[0_0_8px_rgba(251,191,36,0.2)] mb-2">
            SABHI GARIB BHAI TELEGRAM CHANNEL JOIN KAREN
        </div>

    </div>

</body>
</html>
