<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Vikas Laddha - Stock Market Channel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Color-changing background (Red, Blue, Yellow, White/Light tones) */
            background: linear-gradient(-45deg, #ff3333, #3366ff, #ffcc00, #f8fafc, #ff3333);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
            padding: 10px 20px 20px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 18px 22px 22px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            margin-top: 5px;
        }

        .badge {
            display: inline-block;
            border: 1.5px solid #ffcc00;
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            background: rgba(255, 204, 0, 0.1);
        }

        .profile-container {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
        }

        .profile-pic {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3.5px solid #ffcc00;
            box-shadow: 0 0 18px rgba(255, 204, 0, 0.7);
        }

        .profile-name {
            color: #ffcc00;
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .divider {
            border: none;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
            margin: 0 10px 16px 10px;
        }

        .features-container {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 16px;
            text-align: left;
            padding: 0 5px;
        }

        .feature-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-icon {
            font-size: 1.05rem;
            margin-right: 10px;
            min-width: 24px;
            text-align: center;
        }

        .feature-text {
            color: #f1f5f9;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .single-line {
            white-space: nowrap;
            font-size: 0.78rem;
        }

        /* 3-Box Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(6, 78, 59, 0.25);
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
        }

        .stat-value {
            color: #34d399;
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-label {
            color: #cbd5e1;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        @keyframes borderBubble {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.8);
            }
            70% {
                box-shadow: 0 0 0 14px rgba(255, 204, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
            }
        }

        .join-btn {
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            color: #111111;
            border: none;
            border-radius: 12px;
            width: 100%;
            padding: 15px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 16px;
            animation: borderBubble 2s infinite ease-in-out;
            transition: transform 0.1s ease;
        }

        .join-btn:hover {
            animation: borderBubble 1s infinite ease-in-out;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            color: #cbd5e1;
            font-size: 0.75rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .verified-badge {
            color: #38bdf8;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Top Badge -->
        <div class="badge">India's Best Stock Market Channel</div>

        <!-- Profile Picture with Yellow Border -->
        <div class="profile-container">
            <img src="IMG_20250720_155619_451.jpg" alt="Dr. Vikas Laddha" class="profile-pic">
        </div>

        <!-- Name Heading -->
        <h2 class="profile-name">Dr. Vikas Laddha</h2>

        <!-- Divider Line added right after Name -->
        <hr class="divider">

        <!-- Features List -->
        <div class="features-container">
            <div class="feature-row">
                <span class="feature-icon">🔥</span>
                <span class="feature-text">100% Free Market Updates</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">📊</span>
                <span class="feature-text">Daily Nifty & BankNifty Levels</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">🎓</span>
                <span class="feature-text single-line">No Paid Tips – Purely Educational</span>
            </div>
            <div class="feature-row">
                <span class="feature-icon">⏳</span>
                <span class="feature-text">5+ Years of Market Experience</span>
            </div>
        </div>

        <!-- 3-Box Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value">50K+</div>
                <div class="stat-label">Members</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">SEBI</div>
                <div class="stat-label">Registered</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">FREE</div>
                <div class="stat-label">Join</div>
            </div>
        </div>

        <!-- Telegram Button with Border Bubbling -->
        <button class="join-btn">
            JOIN OFFICIAL TELEGRAM CHANNEL
        </button>

        <!-- Footer -->
        <p class="footer-text">
            <span class="verified-badge">✔ Verified Channel</span> • Free Forever • No Spam
        </p>
    </div>

</body>
</html>
