<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Guru - Cricket Analyst UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen font-sans">

    <!-- Mobile Screen Container -->
    <div class="w-[390px] bg-[#0b0f19] rounded-[36px] border-2 border-amber-400 p-6 shadow-[0_0_30px_rgba(251,191,36,0.15)] text-white flex flex-col items-center relative overflow-hidden">
        
        <!-- Header Section -->
        <h1 class="text-3xl font-black tracking-widest text-amber-400 text-center drop-shadow-[0_0_12px_rgba(251,191,36,0.4)] mt-2">KING GURU</h1>
        <p class="text-[10px] tracking-[0.2em] text-cyan-200 font-bold mt-1 mb-6 uppercase text-center">The Ultimate Cricket Analyst</p>

        <!-- Top Section: Thumbnail & Dual Action Buttons -->
        <div class="flex w-full gap-3 mb-5">
            <!-- Thumbnail Image -->
            <div class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-amber-400/80 shrink-0 shadow-md">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=300&q=80" alt="Scenery Thumbnail" class="w-full h-full object-cover">
            </div>
            <!-- Stacked Buttons -->
            <div class="flex flex-col justify-between flex-1 gap-2">
                <button class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 px-3 rounded-xl shadow-md flex items-center justify-center gap-2 border border-blue-400/30 transition-all cursor-pointer">
                    <span>🏆</span> THE ELITE
                </button>
                <button class="w-full bg-amber-400 hover:bg-amber-300 text-gray-950 text-xs font-black py-3 px-3 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all cursor-pointer">
                    KING OF MARKET
                </button>
            </div>
        </div>

        <!-- Main CTA Button -->
        <button class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_4px_20px_rgba(37,99,235,0.4)] flex items-center justify-center gap-3 mb-5 text-sm tracking-wide border border-blue-400/40 transition-all cursor-pointer">
            <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-sm">
                <i class="fa-brands fa-telegram text-base"></i>
            </span>
            JOIN CHANNEL
        </button>

        <!-- Feature List Items -->
        <div class="w-full space-y-3 mb-6">
            <div class="w-full bg-[#121826] border border-gray-800/80 rounded-2xl py-3.5 px-4 flex items-center gap-3 text-xs font-bold tracking-wider text-gray-200 shadow-inner">
                <span class="text-cyan-400 text-sm">✓</span> STRATEGIC ANALYSIS
            </div>
            <div class="w-full bg-[#121826] border border-gray-800/80 rounded-2xl py-3.5 px-4 flex items-center gap-3 text-xs font-bold tracking-wider text-gray-200 shadow-inner">
                <span class="text-cyan-400 text-sm">⚡</span> INSTANT MATCH UPDATES
            </div>
        </div>

        <!-- Redirect Timer -->
        <div class="text-xs text-gray-300 font-medium mb-5 text-center">
            Redirecting in <span class="text-emerald-400 font-bold">10s</span>
        </div>

        <!-- Divider -->
        <div class="w-full h-[1px] bg-gray-800 mb-4"></div>

        <!-- Footer Disclaimers -->
        <div class="text-[9px] text-gray-400 text-center tracking-wider uppercase mb-2 font-medium">
            For research & entertainment purposes only
        </div>
        <div class="text-[8px] text-gray-500 text-center leading-relaxed px-2">
            Not affiliated with Meta Platforms, Inc. All trademarks belong to their respective owners.
        </div>

    </div>

</body>
</html>
